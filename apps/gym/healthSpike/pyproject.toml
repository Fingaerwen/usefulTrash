# Talon's Health Connect spike (plan HC1.1): a throwaway app that checks the healthConnect extension on your phone
# before Talon 0.6 uses it. Its own package and the debug key, so the real Talon is never touched. Never imported by
# anything. Kept as the record, like spikes/phase0.
[project]
name = "talonHealthSpike"
version = "0.0.1"
description = "Talon's Health Connect check"
requires-python = "==3.14.*"  # the Python Flet bundles for Android (R3)
dependencies = [
    "flet==1.0.3",
    # Our own package. It must have a local path below, or a build would look the name up on PyPI (CS1.1).
    "usefulTrashHealthConnect",
]

# Local packages: paths are relative to this folder, so the repo builds from wherever it's cloned.
[tool.flet.dev_packages]
usefulTrashHealthConnect = "../../../extensions/healthConnect"

[tool.flet]
product = "Talon health spike"
org = "io.github.fingaerwen"
build_number = 1

[tool.flet.android]
bundle_id = "io.github.fingaerwen.healthspike"  # its own package, apart from Talon (io.github.fingaerwen.gymtracker)
target_arch = ["arm64-v8a"]  # your phone's CPU type only: one small APK (RL3)
min_sdk_version = 26  # Health Connect's client library needs Android 8, as in Talon

[tool.flet.app]
path = "src"

# Workaround for a Flet 1.0.3 template bug (found in Phase 0): it pins Dart package jni to 1.0.0,
# but jni_flutter 1.0.4+1 requires jni ^1.1.0, so the Android build fails.
[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"
