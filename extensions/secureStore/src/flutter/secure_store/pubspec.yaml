# Dart/Flutter side of the secureStore extension. Dart package names must be lower_snake_case.
name: secure_store
description: usefulTrash encrypted storage with a phone-locked key (Flet extension + Android plugin)
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flet: 1.0.3  # same version the app uses

# Declares the Kotlin code in android/ as a Flutter plugin, so Android loads it.
flutter:
  plugin:
    platforms:
      android:
        package: io.github.fingaerwen.securestore
        pluginClass: SecureStorePlugin
