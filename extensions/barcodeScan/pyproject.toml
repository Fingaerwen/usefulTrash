# barcodeScan: our own Flet extension for scanning food barcodes (Ambrosia's Phase 0 check 1).
# Python side (src/barcodeScan) talks to a Dart/Kotlin plugin (src/flutter/barcode_scan) with two scanners to
# compare: Google's code scanner (Play services) and ZXing (open source, entirely on the phone).
[project]
name = "usefulTrashBarcodeScan"  # unique prefix (CS1.1)
version = "0.1.0"
description = "Barcode scanning for usefulTrash (Android)"
requires-python = "==3.14.*"
dependencies = ["flet==1.0.3"]

[tool.setuptools.package-data]
# Ship the Flutter/Android plugin files inside the Python package so `flet build` finds them.
"flutter.barcode_scan" = ["pubspec.yaml", "lib/**", "android/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
