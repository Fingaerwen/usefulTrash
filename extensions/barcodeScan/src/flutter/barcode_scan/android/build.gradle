// Android build settings for the barcodeScan plugin (mirrors the weighInNotify plugin's toolchain).
group 'io.github.fingaerwen.barcodescan'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.github.fingaerwen.barcodescan'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion flutter.minSdkVersion
    }
    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        // ZXing's scanner screen (open source, Apache 2.0): the newest release (4.3.0), needs Android 7 (API 24).
        implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    }
}
