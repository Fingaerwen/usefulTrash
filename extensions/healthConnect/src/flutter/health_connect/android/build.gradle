// Android build settings for the healthConnect plugin (mirrors other plugins that build with this toolchain).
group 'io.github.fingaerwen.healthconnect'
version '0.1.0'

buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.github.fingaerwen.healthconnect'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 26  // Health Connect's client library needs Android 8. Talon's build sets the same (HC1.1)
    }
    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation 'androidx.health.connect:connect-client:1.1.0'  // Google's Health Connect client, stable
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'  // the version the client uses
    }
}
