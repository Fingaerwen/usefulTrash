# nativeGoogleSignIn: our own Flet extension for native Google sign-in on Android (Phase 0 check 2, plan AU1c).
# Python side (src/nativeGoogleSignIn) talks to a Dart/Kotlin plugin (src/flutter/native_google_sign_in)
# that uses Android's Credential Manager with Google's official sign-in library. No client secret anywhere.
[project]
name = "nativeGoogleSignIn"
version = "0.1.0"
description = "Native Google sign-in for usefulTrash (Android)"
requires-python = "==3.14.*"
dependencies = ["flet==1.0.3"]

[tool.setuptools.package-data]
# Ship the Flutter/Android plugin files inside the Python package so `flet build` finds them.
"flutter.native_google_sign_in" = ["pubspec.yaml", "lib/**", "android/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
