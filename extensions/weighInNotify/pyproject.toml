# weighInNotify: our own Flet extension for scheduled phone notifications (Phase 0 check 5).
# Python side (src/weighInNotify) talks to a Dart/Kotlin plugin (src/flutter/weigh_in_notify)
# that uses Android's built-in alarms and notifications. No third-party notification code.
[project]
name = "usefulTrashWeighInNotify"  # unique prefix (CS1.1)
version = "0.1.0"
description = "Scheduled local notifications for usefulTrash (Android)"
requires-python = "==3.14.*"
dependencies = ["flet==1.0.3"]

[tool.setuptools.package-data]
# Ship the Flutter/Android plugin files inside the Python package so `flet build` finds them.
"flutter.weigh_in_notify" = ["pubspec.yaml", "lib/**", "android/**"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
